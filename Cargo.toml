[package]
name = "samsung-tv"
version = "0.1.0"
authors = ["Insidious Fiddler <me@codycody31.dev>"]
edition = "2021"
description = "A Rust library for interacting with Samsung Smart TVs via their API."
license = "MIT"
repository = "https://git.macco.dev/insidiousfiddler/samsung-tv-rs"
homepage = "https://git.macco.dev/insidiousfiddler/samsung-tv-rs"
keywords = ["samsung", "tv", "api", "remote", "rust"]
readme = "README.md"

[lib]
name = "samsung_tv"
crate-type = ["lib"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
native-tls = "0.2"
futures = "0.3"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
base64 = "0.22"
thiserror = "2.0"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json", "blocking"] }

[dev-dependencies]
tokio-test = "0.4"
dirs = "5.0"
